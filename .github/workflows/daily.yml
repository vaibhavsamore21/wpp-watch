name: Daily plugin radar

on:
  schedule:
    - cron: "30 2 * * *"      # 8:00 AM India time every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect + analyze
        run: python run.py daily --details-limit 60
      - name: Commit data, report and dashboard
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs reports
          git diff --cached --quiet || git commit -m "radar: $(date -u +%F)"
          git push
